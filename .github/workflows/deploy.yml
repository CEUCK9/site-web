name: Publication du site

# ---------------------------------------------------------------------------
# ACTIVATION (une seule fois)
#
#   1. Déplacer ce fichier vers .github/workflows/deploy.yml
#      (le pousser demande un jeton avec le droit « workflow » :
#       gh auth refresh -s workflow)
#
#   2. Renseigner les identifiants de l'hébergement OVH dans
#      Settings → Secrets and variables → Actions → onglet Secrets :
#
#        CEUC_SFTP_HOST   ftp.cluster121.hosting.ovh.net
#        CEUC_SFTP_USER   identifiant de l'hébergement
#        CEUC_SFTP_PASS   mot de passe
#
#      Les trois vont bien en Secrets et non en Variables : GitHub masque
#      les secrets dans les journaux d'exécution, qui sont publics puisque
#      le dépôt l'est.
#
#   3. Facultatif, onglet Variables :
#        CEUC_STAGING   1 = site interdit à l'indexation (défaut)
#                       0 = site public, référencé par Google
#        CEUC_SFTP_DIR  dossier cible (défaut : www)
#
# ENSUITE
#
#   Chaque modification poussée sur `main` reconstruit le site et l'envoie
#   sur https://ceuc.fr, sans rien lancer à la main. C'est ce qui permet à
#   l'association de modifier son contenu depuis l'application Claude.
#
# GARDE-FOU
#
#   check.py s'exécute AVANT l'envoi. S'il trouve un lien mort, une balise
#   en double ou une image sans description, la publication échoue et le
#   site en ligne reste intact. Une erreur ne peut pas casser le site.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publication
  cancel-in-progress: false   # ne jamais interrompre un envoi en cours

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        # Pillow prépare les photos, paramiko envoie le site par SFTP.
        run: pip install --quiet Pillow paramiko

      - name: Préparer les photos
        # Sans CEUC_SRC, seules les photos de assets/photos-2026 sont
        # régénérées : déposer une photo dans ce dossier et la déclarer dans
        # src/images.py suffit à la faire arriver sur le site.
        run: python3 src/images.py

      - name: Générer le site
        env:
          CEUC_BASE_URL: https://ceuc.fr
          CEUC_BASE_PATH: ""
          CEUC_STAGING: ${{ vars.CEUC_STAGING || '1' }}
        run: python3 build.py

      - name: Contrôler liens, SEO et structure
        run: python3 check.py

      - name: Envoyer sur l'hébergement OVH
        env:
          CEUC_SFTP_HOST: ${{ secrets.CEUC_SFTP_HOST }}
          CEUC_SFTP_USER: ${{ secrets.CEUC_SFTP_USER }}
          CEUC_SFTP_PASS: ${{ secrets.CEUC_SFTP_PASS }}
          CEUC_SFTP_DIR: ${{ vars.CEUC_SFTP_DIR || 'www' }}
        run: python3 tools/publier_ovh.py

      - name: Vérifier que le site répond
        run: |
          for tentative in 1 2 3; do
            code=$(curl -s -o /dev/null -m 30 -w '%{http_code}' https://ceuc.fr/)
            [ "$code" = "200" ] && { echo "Site en ligne (HTTP $code)"; exit 0; }
            echo "Tentative $tentative : HTTP $code"
            sleep 10
          done
          echo "Le site ne répond pas correctement après l'envoi."
          exit 1
